name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend
        run: npm ci
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: File Converter ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Private repos cannot use github.com/.../releases/.../download URLs with a token.
      # Point the in-app updater at raw.githubusercontent.com + API asset URLs instead.
      - name: Publish private updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $exe = $release.assets | Where-Object { $_.name -like "File Converter_*_x64-setup.exe" } | Select-Object -First 1
          if (-not $exe) { throw "NSIS setup.exe asset not found on $tag" }
          $sigName = "$($exe.name).sig"
          $sigAsset = $release.assets | Where-Object { $_.name -eq $sigName } | Select-Object -First 1
          if (-not $sigAsset) { throw "Missing $sigName" }
          $sigPath = Join-Path $env:RUNNER_TEMP $sigName
          gh api "repos/$repo/releases/assets/$($sigAsset.id)" -H "Accept: application/octet-stream" > $sigPath
          $sig = (Get-Content $sigPath -Raw).Trim()
          $version = $tag.TrimStart("v")
          $pubDate = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          $json = @"
          {
            "version": "$version",
            "notes": "File Converter $version",
            "pub_date": "$pubDate",
            "platforms": {
              "windows-x86_64": {
                "signature": "$sig",
                "url": "https://api.github.com/repos/$repo/releases/assets/$($exe.id)"
              }
            }
          }
          "@
          New-Item -ItemType Directory -Force -Path updater | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "updater/latest.json"), $json.Trim(), $utf8)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/latest.json
          git commit -m "Update private updater manifest for $tag" || echo "No manifest change"
          git push origin HEAD:main
